name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    name: Build, test & pack
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Ensure local feed folder exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts | Out-Null

      - name: Restore
        run: dotnet restore KSC.Observability.sln

      - name: Build
        run: dotnet build KSC.Observability.sln -c Release --no-restore

      - name: Test
        run: dotnet test KSC.Observability.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results

      - name: Pack
        run: dotnet pack KSC.Observability.sln -c Release --no-build

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: ignore
